[project]
name = "ecommerce-inventory-sync"
version = "0.1.0"
description = "Reconcile and sync stock between a 3PL warehouse API and an online shop API — retries, OAuth2, pagination checks, safe dry-runs and n8n scheduling."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Dang Nguyen Giap" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
inventory-sync = "inventory_sync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inventory_sync", "mock_systems"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
